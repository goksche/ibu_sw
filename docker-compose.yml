# IBU Turniere - Docker Compose Configuration
# v1.2.0-alpha.1

services:
  # PostgreSQL Database
  postgres:
    image: postgres:15-alpine
    container_name: ibu_postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-ibu_turniere}
      POSTGRES_USER: ${POSTGRES_USER:-ibu_admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-changeme}
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-ibu_admin} -d ${POSTGRES_DB:-ibu_turniere}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - ibu_network

  # FastAPI Backend
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: ibu_backend
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_DB: ${POSTGRES_DB:-ibu_turniere}
      POSTGRES_USER: ${POSTGRES_USER:-ibu_admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-changeme}
      SECRET_KEY: ${SECRET_KEY:-changeme-change-me-in-production}
      ALGORITHM: HS256
      ACCESS_TOKEN_EXPIRE_MINUTES: 30
      CORS_ORIGINS: ${CORS_ORIGINS:-*}
      DEBUG: ${DEBUG:-False}
      INIT_DB: ${INIT_DB:-true}
      OTP_DEV_MODE: ${OTP_DEV_MODE:-true}
      OTP_EXPIRY_MINUTES: ${OTP_EXPIRY_MINUTES:-10}
      OTP_LENGTH: ${OTP_LENGTH:-6}
      SMTP_HOST: ${SMTP_HOST:-mailhog}
      SMTP_PORT: ${SMTP_PORT:-1025}
      SMTP_USERNAME: ${SMTP_USERNAME:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM: ${SMTP_FROM:-noreply@local.finalstage}
      SMTP_USE_TLS: ${SMTP_USE_TLS:-false}
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
      - backend_logs:/app/logs
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    depends_on:
      postgres:
        condition: service_healthy
      mailhog:
        condition: service_started
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - ibu_network

  # React Frontend (Vite Dev-Server, Port 3000 – gleiche Seiten wie lokal, API über Vite-Proxy)
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: ibu_frontend
    environment:
      # same = Axios nutzt /api/v1 auf gleicher Origin → Vite proxyt nach backend
      VITE_API_URL: same
      VITE_PROXY_TARGET: http://backend:8000
      # Lokal: kein Fallback auf Remote (vermeidet 401 mit lokalem JWT)
      VITE_PROXY_FALLBACK: ${VITE_PROXY_FALLBACK:-off}
    ports:
      - "3000:3000"
    volumes:
      - ./frontend/src:/app/src
      - ./frontend/public:/app/public
      - ./frontend/index.html:/app/index.html
      - ./frontend/vite.config.ts:/app/vite.config.ts
    command: ["node", "node_modules/vite/bin/vite.js", "--port", "3000", "--host", "0.0.0.0"]
    depends_on:
      - backend
    networks:
      - ibu_network

  # Lokaler SMTP-Catcher für OTP/Mails
  mailhog:
    image: mailhog/mailhog:latest
    container_name: ibu_mailhog
    ports:
      - "1025:1025" # SMTP
      - "8025:8025" # Web UI
    networks:
      - ibu_network

# Named Volumes
volumes:
  postgres_data:
    driver: local
  backend_logs:
    driver: local

# Network
networks:
  ibu_network:
    driver: bridge

