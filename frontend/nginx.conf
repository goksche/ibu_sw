server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/xml text/javascript application/x-javascript application/xml+rss application/json;

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;

    # SPA: HTML nicht aggressiv cachen, damit neue Asset-Hashes nach Deploy zuverlässig ankommen
    location = /index.html {
        add_header Cache-Control "no-cache, must-revalidate" always;
        expires -1;
    }

    # SPA routing
    location / {
        try_files $uri $uri/ /index.html;
    }

    # JS/CSS: lange cachen, aber ohne „immutable“, damit Browser bei gleichem Dateinamen (seltener Hash-Kollision) revalidieren können
    location ~* \.(js|css)$ {
        expires 7d;
        add_header Cache-Control "public, max-age=604800" always;
    }

    # Bilder/Schrift
    location ~* \.(png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable" always;
    }
}


