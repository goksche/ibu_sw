# Erst-Deploy auf Produktion: nur HTTP :80 (Let's Encrypt Zertifikate fehlen noch).
# Nach certbot: wieder auf vollstaendige default.conf mit 443 wechseln.
upstream backend { server backend:8000; }
upstream frontend { server frontend:80; }

server {
    listen 80;
    server_name finalstage.ch www.finalstage.ch;

    location /.well-known/acme-challenge/ { root /var/www/certbot; }

    location = / {
        root /var/www/landing;
        try_files /index.html =404;
    }

    location = /strings.json {
        root /var/www/landing;
        default_type application/json;
        add_header Cache-Control "no-store" always;
    }

    location /api {
        proxy_pass http://backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    location /ws {
        proxy_pass http://backend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 86400;
    }
    location /turnier/assets/ {
        rewrite ^/turnier/assets/(.*)$ /assets/$1 break;
        proxy_pass http://frontend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    location / {
        proxy_pass http://frontend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
    }
}
