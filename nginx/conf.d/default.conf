# Upstream für Backend
upstream backend {
    server backend:8000;
}

# Upstream für Frontend
upstream frontend {
    server frontend:80;
}

# HTTP -> HTTPS (inkl. ACME Challenge)
server {
    listen 80;
    server_name gsmartsol.ch www.gsmartsol.ch finalstage.ch www.finalstage.ch;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# HTTPS - gsmartsol.ch
server {
    listen 443 ssl;
    http2 on;
    server_name gsmartsol.ch www.gsmartsol.ch;

    ssl_certificate /etc/letsencrypt/live/gsmartsol.ch/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/gsmartsol.ch/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location /api {
        proxy_pass http://backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Assets: /turnier/assets/* zu /assets/* umschreiben
    location /turnier/assets/ {
        rewrite ^/turnier/assets/(.*)$ /assets/$1 break;
        proxy_pass http://frontend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        proxy_pass http://frontend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
    }
}

