# Platform Core Nginx Configuration
# Multi-App Platform

# Upstream für Platform Core
upstream platform_backend {
    server platform_backend:8000;
}

upstream platform_frontend {
    server platform_frontend:80;
}

# HTTP Server - Redirect zu HTTPS
server {
    listen 80;
    server_name gsmartsol.ch www.gsmartsol.ch;

    # Let's Encrypt Challenge
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # Redirect zu HTTPS
    location / {
        return 301 https://$server_name$request_uri;
    }
}

# HTTPS Server
server {
    listen 443 ssl http2;
    server_name gsmartsol.ch www.gsmartsol.ch;

    # SSL Zertifikate (Let's Encrypt)
    ssl_certificate /etc/letsencrypt/live/gsmartsol.ch/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/gsmartsol.ch/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;

    # Security Headers
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;

    # ============================================
    # PLATFORM CORE ROUTES
    # ============================================

    # Login & Auth API
    location /api/auth {
        proxy_pass http://platform_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Platform API (Dashboard, Admin, Feedback)
    location /api/platform {
        proxy_pass http://platform_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Authorization $http_authorization;
    }

    # Admin Interface
    location /admin {
        proxy_pass http://platform_frontend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_cache_bypass $http_upgrade;
    }

    # Dashboard (Root)
    location = / {
        proxy_pass http://platform_frontend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_cache_bypass $http_upgrade;
    }

    # ============================================
    # DYNAMIC APP ROUTES
    # ============================================
    # Apps werden dynamisch geroutet basierend auf App-Registry
    # Die Konfiguration wird bei App-Deployment automatisch generiert
    # und in apps.conf eingefügt

    # Include dynamic app routes
    include /etc/nginx/conf.d/apps.conf;
}

